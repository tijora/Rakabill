<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakabill - Modern Billing Solution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #invoice-preview, #invoice-preview * { visibility: visible; }
      #invoice-preview { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <!-- Header / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div id="logo-container" class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg">
          R
        </div>
        <h1 class="text-2xl font-black tracking-wider text-indigo-400">Rakabill</h1>
      </div>
      <div class="flex items-center gap-2 no-print">
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-medium transition text-sm">Print</button>
        <button onclick="downloadPDF()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium transition text-sm">Download PDF</button>
        <button onclick="shareInvoice()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-medium transition text-sm">Share</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 my-6">
    <!-- Form Controls Section -->
    <section class="lg:col-span-6 space-y-6 no-print">
      <!-- Profile & Settings -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
        <h2 class="text-lg font-bold text-indigo-300 border-b border-slate-700 pb-2">Business Profile</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Business Name</label>
            <input type="text" id="biz-name" oninput="updateInvoice()" placeholder="My Business" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Contact / Address</label>
            <input type="text" id="biz-contact" oninput="updateInvoice()" placeholder="Phone / Address" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Category</label>
          <select id="biz-category" onchange="changeCategory()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
            <option value="pharmacy">Pharmacy / Medical</option>
            <option value="grocery">Grocery / Supermarket</option>
            <option value="general">General Store / Services</option>
          </select>
        </div>
      </div>

      <!-- Customer Info -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
        <h2 class="text-lg font-bold text-indigo-300 border-b border-slate-700 pb-2">Customer Details</h2>
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="cust-name" oninput="updateInvoice()" placeholder="Customer Name" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
          <input type="text" id="cust-phone" oninput="updateInvoice()" placeholder="Customer Phone" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
      </div>

      <!-- Add Item Dynamic Form -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
        <h2 class="text-lg font-bold text-indigo-300 border-b border-slate-700 pb-2">Add Item</h2>
        <div id="dynamic-inputs" class="grid grid-cols-2 gap-3">
          <!-- Inputs will be dynamically rendered based on selected category -->
        </div>
        <button onclick="addItem()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition shadow-md">Add to Invoice</button>
      </div>

      <!-- Taxes & Discounts -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Tax (%)</label>
          <input type="number" id="tax-rate" value="0" oninput="renderInvoice()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Discount ($)</label>
          <input type="number" id="discount-val" value="0" oninput="renderInvoice()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
      </div>
    </section>

    <!-- Invoice Preview Section -->
    <section class="lg:col-span-6">
      <div id="invoice-preview" class="bg-white text-slate-800 p-6 rounded-xl shadow-2xl min-h-[500px] flex flex-col justify-between border border-slate-200">
        <div class="space-y-6">
          <!-- Invoice Header -->
          <div class="flex justify-between items-start border-b pb-4">
            <div>
              <h2 id="prev-biz-name" class="text-2xl font-bold text-slate-900">Your Business Name</h2>
              <p id="prev-biz-contact" class="text-xs text-slate-500">Address & Contact Info</p>
            </div>
            <div class="text-right">
              <span id="category-badge" class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded uppercase">PHARMACY</span>
              <p class="text-xs text-slate-400 mt-2">Invoice #: RKB-<span id="inv-num">1001</span></p>
            </div>
          </div>

          <!-- Billed To -->
          <div class="bg-slate-50 p-3 rounded border border-slate-100">
            <p class="text-xs text-slate-400 font-semibold uppercase">Billed To:</p>
            <p id="prev-cust-name" class="font-bold text-sm text-slate-700">Client Name</p>
            <p id="prev-cust-phone" class="text-xs text-slate-500">Client Contact Info</p>
          </div>

          <!-- Items Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr id="table-headers" class="border-b-2 border-slate-200 text-slate-600 uppercase font-semibold">
                  <!-- Dynamic Headers -->
                </tr>
              </thead>
              <tbody id="items-list" class="divide-y divide-slate-100">
                <!-- Dynamic Items -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Totals & Summary -->
        <div class="border-t pt-4 space-y-1 text-xs text-right mt-6">
          <div class="flex justify-between text-slate-500"><span>Subtotal:</span><span id="subtotal-val">$0.00</span></div>
          <div class="flex justify-between text-slate-500"><span>Tax:</span><span id="tax-val">$0.00</span></div>
          <div class="flex justify-between text-slate-500"><span>Discount:</span><span id="discount-calc-val">-$0.00</span></div>
          <div class="flex justify-between font-bold text-base text-slate-900 border-t pt-2 mt-1"><span>Total:</span><span id="grand-total">$0.00</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CONFIGS = {
      pharmacy: {
        badge: 'PHARMACY',
        fields: [
          { id: 'f1', label: 'Medicine Name', type: 'text' },
          { id: 'f2', label: 'Batch No', type: 'text' },
          { id: 'f3', label: 'Qty', type: 'number' },
          { id: 'f4', label: 'Price', type: 'number' }
        ],
        headers: ['Medicine', 'Batch', 'Qty', 'Price', 'Total']
      },
      grocery: {
        badge: 'GROCERY',
        fields: [
          { id: 'f1', label: 'Item Name', type: 'text' },
          { id: 'f2', label: 'Unit (kg/pcs)', type: 'text' },
          { id: 'f3', label: 'Weight/Qty', type: 'number' },
          { id: 'f4', label: 'Price/Unit', type: 'number' }
        ],
        headers: ['Item', 'Unit', 'Qty', 'Price', 'Total']
      },
      general: {
        badge: 'GENERAL',
        fields: [
          { id: 'f1', label: 'Item/Service', type: 'text' },
          { id: 'f2', label: 'Description', type: 'text' },
          { id: 'f3', label: 'Qty', type: 'number' },
          { id: 'f4', label: 'Rate', type: 'number' }
        ],
        headers: ['Item', 'Desc', 'Qty', 'Rate', 'Total']
      }
    };

    let items = [];

    function changeCategory() {
      const cat = document.getElementById('biz-category').value;
      const config = CONFIGS[cat];
      const container = document.getElementById('dynamic-inputs');
      
      container.innerHTML = config.fields.map(f => `
        <div>
          <label class="block text-xs text-slate-400 mb-1">${f.label}</label>
          <input type="${f.type}" id="input-${f.id}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
      `).join('');

      document.getElementById('category-badge').innerText = config.badge;
      items = [];
      renderInvoice();
    }

    function addItem() {
      const f1 = document.getElementById('input-f1').value;
      const f2 = document.getElementById('input-f2').value;
      const qty = parseFloat(document.getElementById('input-f3').value) || 0;
      const price = parseFloat(document.getElementById('input-f4').value) || 0;

      if (!f1 || qty <= 0 || price <= 0) return;

      items.push({ f1, f2, qty, price, total: qty * price });
      
      document.getElementById('input-f1').value = '';
      document.getElementById('input-f2').value = '';
      document.getElementById('input-f3').value = '';
      document.getElementById('input-f4').value = '';

      renderInvoice();
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderInvoice();
    }

    function updateInvoice() {
      document.getElementById('prev-biz-name').innerText = document.getElementById('biz-name').value || 'Your Business Name';
      document.getElementById('prev-biz-contact').innerText = document.getElementById('biz-contact').value || 'Address & Contact Info';
      document.getElementById('prev-cust-name').innerText = document.getElementById('cust-name').value || 'Client Name';
      document.getElementById('prev-cust-phone').innerText = document.getElementById('cust-phone').value || 'Client Contact Info';
    }

    function renderInvoice() {
      const cat = document.getElementById('biz-category').value;
      const config = CONFIGS[cat];
      
      // Render Headers
      document.getElementById('table-headers').innerHTML = config.headers.map(h => `<th class="py-2">${h}</th>`).join('') + `<th class="py-2 text-right no-print">Action</th>`;

      // Render Items
      const list = document.getElementById('items-list');
      let subtotal = 0;

      list.innerHTML = items.map((item, index) => {
        subtotal += item.total;
        return `
          <tr class="border-b border-slate-50">
            <td class="py-2 font-medium">${item.f1}</td>
            <td class="py-2 text-slate-500">${item.f2}</td>
            <td class="py-2">${item.qty}</td>
            <td class="py-2">$${item.price.toFixed(2)}</td>
            <td class="py-2">$${item.total.toFixed(2)}</td>
            <td class="py-2 text-right no-print">
              <button onclick="removeItem(${index})" class="text-red-500 font-bold hover:underline">X</button>
            </td>
          </tr>
        `;
      }).join('');

      // Calculations
      const taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
      const discount = parseFloat(document.getElementById('discount-val').value) || 0;
      const taxAmount = (subtotal * taxRate) / 100;
      const grandTotal = Math.max(0, subtotal + taxAmount - discount);

      document.getElementById('subtotal-val').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('tax-val').innerText = `$${taxAmount.toFixed(2)}`;
      document.getElementById('discount-calc-val').innerText = `-$${discount.toFixed(2)}`;
      document.getElementById('grand-total').innerText = `$${grandTotal.toFixed(2)}`;
    }

    function shareInvoice() {
      if (navigator.share) {
        navigator.share({
          title: 'Rakabill Invoice',
          text: `Invoice from ${document.getElementById('biz-name').value || 'Rakabill'}`,
          url: window.location.href
        }).catch(() => {});
      } else {
        alert('Sharing is not supported on this device/browser.');
      }
    }

    function downloadPDF() {
      window.print();
    }

    // Initialize
    changeCategory();
  </script>
</body>
</html>
